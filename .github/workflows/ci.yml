name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Run shellcheck
        run: shellcheck -x plugins/review-loop/hooks/*.sh plugins/review-loop/scripts/*.sh plugins/review-loop/tests/*.sh
      - name: Run plugin test suite
        run: |
          cd plugins/review-loop/tests
          fail=0
          for test in *.sh; do
            printf 'running %s\n' "$test"
            bash "$test" || { printf 'FAILED: %s\n' "$test"; fail=1; }
          done
          exit "$fail"
